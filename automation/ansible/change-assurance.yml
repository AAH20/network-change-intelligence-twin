---
- name: Capture and validate a bounded network canary
  hosts: canary_network_devices
  gather_facts: false
  serial: 1
  tasks:
    - name: Capture pre-change configuration
      ansible.netcommon.cli_command: {command: show running-config}
      register: prechange
      changed_when: false
    - name: Capture BGP state
      ansible.netcommon.cli_command: {command: show bgp summary}
      register: bgp
      changed_when: false
    - name: Refuse change without established adjacency
      ansible.builtin.assert:
        that: "'Established' in bgp.stdout"
        fail_msg: Twin preconditions failed; production change is prohibited.
    - name: Persist rollback input
      ansible.builtin.copy:
        content: "{{ prechange.stdout }}"
        dest: "/tmp/{{ inventory_hostname }}-prechange.cfg"
        mode: "0600"
      delegate_to: localhost
      changed_when: false

# The production mutation is intentionally absent. Vendor-specific candidate,
# commit-confirmed, postcheck and rollback tasks require an approved adapter.
